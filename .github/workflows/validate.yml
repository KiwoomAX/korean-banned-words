# 데이터 파일의 형식만 확인한다. 어떤 단어를 넣을지는 사람이 정하므로 여기서 보지 않는다.
name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python validate.py
